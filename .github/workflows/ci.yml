name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - name: registry is fresh (r/ committed == generated)
        run: git diff --exit-code r/
      - name: example figures are contract-valid
        run: python3 skills/buena-graphs/scripts/validate-figures.py skills/buena-graphs/examples/*.md
      - name: readme components table is fresh
        run: node scripts/gen-readme-components.mjs && git diff --exit-code README.md
